<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Caixas (Carga) -->
  <rect x="20" y="30" width="30" height="40" fill="#0B2545" rx="3" />
  <rect x="50" y="20" width="30" height="50" fill="#13315C" rx="3" />
  <rect x="30" y="10" width="40" height="20" fill="#134074" rx="3" />
  
  <!-- Fita/Detalhes nas caixas -->
  <line x1="35" y1="30" x2="35" y2="70" stroke="#F4F7F6" stroke-width="2" stroke-dasharray="4,2" opacity="0.5"/>
  <line x1="65" y1="20" x2="65" y2="70" stroke="#F4F7F6" stroke-width="2" stroke-dasharray="4,2" opacity="0.5"/>
  <line x1="50" y1="10" x2="50" y2="30" stroke="#F4F7F6" stroke-width="2" stroke-dasharray="4,2" opacity="0.5"/>
  
  <!-- Palete -->
  <rect x="10" y="72" width="80" height="6" fill="#D97706" rx="2"/>
  <rect x="15" y="78" width="10" height="10" fill="#B45309" rx="1"/>
  <rect x="45" y="78" width="10" height="10" fill="#B45309" rx="1"/>
  <rect x="75" y="78" width="10" height="10" fill="#B45309" rx="1"/>
  <rect x="10" y="88" width="80" height="6" fill="#D97706" rx="2"/>
</svg>